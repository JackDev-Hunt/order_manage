<!-- components/navbar.html -->
<header id="app-navbar" class="sticky top-0 z-30 bg-white border-b border-slate-200">
  <div class="flex items-center justify-between h-14 sm:h-16 px-3 sm:px-4 lg:px-6 gap-2">

    <!-- Left -->
    <div class="flex items-center gap-2 sm:gap-3 min-w-0 flex-1">
      <button type="button" id="sidebar-toggle"
              class="lg:hidden inline-flex items-center justify-center w-10 h-10 rounded-lg shrink-0
                     text-slate-600 hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500"
              aria-label="Open menu" aria-controls="app-sidebar" aria-expanded="false">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <!-- Page title (set by JS) -->
      <h1 id="page-title" class="text-base sm:text-lg font-semibold text-slate-900 truncate">
        Dashboard
      </h1>
    </div>

    <!-- Right -->
    <div class="flex items-center gap-1 sm:gap-1.5 shrink-0">
      <button type="button" id="notif-btn"
              class="relative inline-flex items-center justify-center w-10 h-10 rounded-lg
                     text-slate-600 hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500"
              aria-label="Notifications">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
      </button>

      <div class="relative">
        <button type="button" id="profile-btn"
                class="inline-flex items-center gap-2 pl-1 pr-1.5 sm:pr-2.5 py-1 rounded-lg
                       hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500"
                aria-haspopup="true" aria-expanded="false" aria-controls="profile-menu">
          <span class="relative">
            <span id="profile-avatar"
                  class="inline-flex items-center justify-center w-8 h-8 rounded-full bg-brand-100 text-brand-700 font-semibold text-sm">A</span>
            <span class="absolute bottom-0 right-0 w-2 h-2 rounded-full bg-green-500 ring-2 ring-white"></span>
          </span>
          <span class="hidden sm:flex flex-col items-start leading-tight max-w-[120px]">
            <span id="profile-name" class="text-sm font-medium text-slate-900 truncate">Admin</span>
            <span id="profile-role" class="text-[11px] text-slate-500 truncate">Loading…</span>
          </span>
        </button>
        <div id="profile-menu"
             class="hidden absolute right-0 mt-2 w-60 origin-top-right bg-white rounded-xl border border-slate-200 shadow-lg overflow-hidden"
             role="menu">
          <div class="px-4 py-3 border-b border-slate-100 bg-slate-50/50">
            <p id="menu-name" class="text-sm font-semibold text-slate-900 truncate">Admin</p>
            <p id="menu-email" class="text-xs text-slate-500 truncate">—</p>
          </div>
          <div class="border-t border-slate-100">
            <button type="button" id="logout-btn" role="menuitem"
                    class="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-red-600 hover:bg-red-50">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
              </svg>
              Logout
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
