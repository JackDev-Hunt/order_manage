<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>Login — Order Management</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50:"#eff6ff",100:"#dbeafe",500:"#3b82f6",600:"#2563eb",700:"#1d4ed8",900:"#1e3a8a" }
          },
          fontFamily: { sans: ["Inter","system-ui","sans-serif"] }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center px-4 py-8">

  <main class="w-full max-w-md">
    <!-- Logo / Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-brand-600 text-white mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
        </svg>
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900">Welcome back</h1>
      <p class="text-sm text-slate-500 mt-1">Sign in to your account to continue</p>
    </div>

    <!-- Login Form Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
      <form id="login-form" novalidate>
        <!-- Email -->
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1.5">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
            class="w-full px-4 py-3 sm:py-2.5 rounded-lg border border-slate-300 text-slate-900
                   placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500
                   focus:border-brand-500 transition"
            placeholder="you@example.com"
          />
        </div>

        <!-- Password -->
        <div class="mb-5">
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
          <div class="relative">
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
              minlength="6"
              class="w-full px-4 py-3 sm:py-2.5 rounded-lg border border-slate-300 text-slate-900
                     placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500
                     focus:border-brand-500 transition pr-12"
              placeholder="••••••••"
            />
            <button
              type="button"
              id="toggle-password"
              class="absolute right-2 top-1/2 -translate-y-1/2 p-2 rounded-md text-slate-500 hover:bg-slate-100
                     focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500"
              aria-label="Show password"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember / Forgot -->
        <div class="flex items-center justify-between mb-6">
          <label class="inline-flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
            <input type="checkbox" id="remember" class="w-4 h-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500" />
            Remember me
          </label>
          <button type="button" id="forgot-btn"
                  class="text-sm font-medium text-brand-600 hover:text-brand-700
                         focus:outline-none focus-visible:underline">
            Forgot password?
          </button>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          id="login-btn"
          class="w-full inline-flex items-center justify-center gap-2 px-4 py-3 sm:py-2.5 rounded-lg
                 bg-brand-600 hover:bg-brand-700 active:bg-brand-700 text-white font-medium
                 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2
                 transition disabled:opacity-60 disabled:cursor-not-allowed"
        >
          <span class="btn-label">Sign in</span>
        </button>
      </form>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">
      © <span id="year"></span> Order Management. All rights reserved.
    </p>
  </main>

  <!-- Toast container -->
  <div id="toast-container"
       class="fixed top-4 right-4 left-4 sm:left-auto sm:top-6 sm:right-6 z-[9999]
              flex flex-col gap-2 pointer-events-none"
       role="region" aria-label="Notifications" aria-live="polite"></div>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- PAGE-SPECIFIC JAVASCRIPT (inline module)              -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <script type="module">
  import {
    loginUser,
    mapAuthError,
    redirectIfAuthenticated,
    resetPassword,
  } from "./assets/js/firebase/auth.js";
  import { toast } from "./assets/js/utils/toast.js";
  import {
    isValidEmail,
    setFieldError,
    clearFieldError,
    clearFormErrors,
  } from "./assets/js/utils/helpers.js";

  // ── If already logged in, skip login page ─────────────
  redirectIfAuthenticated("pages/dashboard.html");

  // ── DOM refs ──────────────────────────────────────────
  const form          = document.getElementById("login-form");
  const emailInput    = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const submitBtn     = document.getElementById("login-btn");
  const toggleBtn     = document.getElementById("toggle-password");
  const forgotBtn     = document.getElementById("forgot-btn");
  const yearEl        = document.getElementById("year");

  // ── Footer year ───────────────────────────────────────
  yearEl.textContent = new Date().getFullYear();

  // ── Password visibility toggle ────────────────────────
  toggleBtn.addEventListener("click", () => {
    const isPwd = passwordInput.type === "password";
    passwordInput.type = isPwd ? "text" : "password";
    toggleBtn.setAttribute("aria-label", isPwd ? "Hide password" : "Show password");
  });

  // ── Clear field errors on typing ──────────────────────
  [emailInput, passwordInput].forEach((input) =>
    input.addEventListener("input", () => clearFieldError(input))
  );

  // ── Submit handler ────────────────────────────────────
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    clearFormErrors(form);

    const email    = emailInput.value.trim();
    const password = passwordInput.value;

    // Client-side validation
    let hasError = false;
    if (!email) {
      setFieldError(emailInput, "Email is required.");
      hasError = true;
    } else if (!isValidEmail(email)) {
      setFieldError(emailInput, "Enter a valid email address.");
      hasError = true;
    }
    if (!password) {
      setFieldError(passwordInput, "Password is required.");
      hasError = true;
    } else if (password.length < 6) {
      setFieldError(passwordInput, "Password must be at least 6 characters.");
      hasError = true;
    }
    if (hasError) return;

    setLoading(true);
    try {
      await loginUser(email, password);
      toast.success("Login successful. Redirecting…");

      // Sanitize `next` param — only allow relative paths inside this app
      const params = new URLSearchParams(location.search);
      const rawNext = params.get("next") || "";
      const safeNext = sanitizeNext(rawNext, "pages/dashboard.html");

      setTimeout(() => window.location.replace(safeNext), 400);
    } catch (err) {
      console.error("Login error:", err);
      toast.error(mapAuthError(err?.code || ""));
      setLoading(false);
    }
  });

  // ── Forgot password ───────────────────────────────────
  forgotBtn.addEventListener("click", async () => {
    const email = emailInput.value.trim();

    if (!email) {
      setFieldError(emailInput, "Enter your email first, then click Forgot password.");
      emailInput.focus();
      return;
    }
    if (!isValidEmail(email)) {
      setFieldError(emailInput, "Enter a valid email address.");
      emailInput.focus();
      return;
    }

    try {
      await resetPassword(email);
      toast.success(`Password reset link sent to ${email}.`);
    } catch (err) {
      console.error("Reset password error:", err);
      toast.error(mapAuthError(err?.code || ""));
    }
  });

  // ── Helpers ───────────────────────────────────────────
  function setLoading(isLoading) {
    submitBtn.disabled = isLoading;
    submitBtn.querySelector(".btn-label").textContent =
      isLoading ? "Signing in…" : "Sign in";
    submitBtn.classList.toggle("opacity-80", isLoading);
  }

  /**
   * Prevent open-redirect: only allow relative paths inside the app.
   * Rejects values starting with "//" or "http".
   * @param {string} next
   * @param {string} fallback
   * @returns {string}
   */
  function sanitizeNext(next, fallback) {
    if (!next) return fallback;
    // Reject absolute URLs and protocol-relative URLs
    if (/^(https?:)?\/\//i.test(next)) return fallback;
    // Reject paths with backslashes (browser inconsistency)
    if (next.includes("\\")) return fallback;
    return next;
  }
</script>
</body>
</html>
